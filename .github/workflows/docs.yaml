name: docs

on:
  push:
    paths:
      - 'docs/**'
      - 'info.yaml'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build docs
        uses: TinyTapeout/tt-gds-action/docs@ttsky26d
